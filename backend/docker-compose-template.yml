services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - private
      - public

  cassandra:
    image: cassandra:latest
    container_name: cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: clusterName
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - private

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3001:3000"
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    depends_on:
      - user-service
      - ai-service
    networks:
      - private
      - public

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/user_db
    volumes:
      - ./user-service:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - private

  ai-service:
    build: ./ai-service
    container_name: ai-service
    environment:
      CASSANDRA_KEYSPACE: vendly_ai
    volumes:
      - ./ai-service:/app
      - /app/node_modules
    depends_on:
      - cassandra
    networks:
      - private

volumes:
  cassandra_data:
  db-data:
networks:
  private:
  public:
